name: UroBladR Build Check and Tests

on:
  pull_request:
    branches: [main]

jobs:
  build-check-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::devtools

      - name: Check out repository
        uses: actions/checkout@v3
        
      - name: Install BiocManager
        run: Rscript -e "install.packages('BiocManager')"

      - name: Install Biobase
        run: Rscript -e "BiocManager::install("Biobase")"
        
      - name: Install UroBladR
        run: Rscript -e "devtools::install(repos = BiocManager::repositories())"

      - name: Check UroBladR
        run: Rscript -e "devtools::check(vignettes = FALSE)"
    